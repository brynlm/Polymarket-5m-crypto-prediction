name: Scheduled model retrain

"on":
  schedule:
    - cron: "17 6 * * 0"  # weekly, Sunday 06:17 UTC
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write  # needed so the job can commit/push the retrained model

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth-1) clone: scheduled_retrain.py
          # amends its own previous commit in place (git commit --amend) to keep main's
          # history flat instead of growing a commit per run. A shallow clone has no
          # parent commit available locally, so amending it produces a disconnected
          # root commit with no ancestry — exactly what happened before this fix.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain and deploy if safe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scheduled_retrain.py
